<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Трансформационный Клуб — пространство для роста и исследования" />
    <title>Трансформационный Клуб</title>
  </head>
  <body class="bg-bg text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Аналитика: GoatCounter — cookieless, агрегат, без consent-баннера. -->
    <!-- Считает просмотры всех страниц сайта. Дашборд: https://tclub.goatcounter.com -->
    <!-- Сайт на HashRouter (#/archive/...), поэтому путь берём из location.hash, -->
    <!-- иначе все страницы записывались бы как «/». -->
    <script>
      window.goatcounter = {
        path: function (p) {
          var h = location.hash.replace(/^#/, '');
          return h || p || '/';
        }
      };
    </script>
    <script data-goatcounter="https://tclub.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    <script>
      // HashRouter-переходы (#/archive → #/archive/2026-04) считаем вручную.
      window.addEventListener('hashchange', function () {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: location.hash.replace(/^#/, '') || '/' });
        }
      });
    </script>
  </body>
</html>
